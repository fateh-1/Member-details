<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
  </defs>
  <!-- Background with gentle squircle rounding -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" />
  
  <!-- Modern Customer Silhouette -->
  <!-- Head -->
  <circle cx="256" cy="180" r="76" fill="url(#avatarGrad)" />
  
  <!-- Body / Shoulders -->
  <path d="M120 380 C120 300, 180 280, 256 280 C332 280, 392 300, 392 380 C392 396, 380 404, 360 404 L152 404 C132 404, 120 396, 120 380 Z" fill="url(#avatarGrad)" />

  <!-- Shield / Verified Check Badge -->
  <g transform="translate(320, 290)">
    <circle cx="48" cy="48" r="46" fill="#10b981" stroke="#ffffff" stroke-width="8" />
    <path d="M32 48 L44 60 L66 36" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
